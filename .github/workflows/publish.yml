name: Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Stage the npm release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require a release tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Publishing runs from a release tag such as 0.3.0. Re-run this workflow from the tag, not from a branch."
          exit 1
      - name: Validate the version tag
        run: |
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not a release version such as 0.3.0."
            exit 1
          fi
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify the tag matches package.json
        run: |
          package_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          if [ "$package_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package.json version $package_version."
            exit 1
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality gates
        run: pnpm run check
      - name: Inspect the package contents
        run: pnpm pack --dry-run
      # The release tag checks out a detached HEAD, so pnpm's git checks for the publish
      # branch cannot pass. Keep the checks on everywhere else and stage with the pinned
      # pnpm; its OIDC exchange needs the id-token: write permission set above.
      - name: Stage the release on npm
        run: |
          pnpm stage publish \
            --registry https://registry.npmjs.org/ \
            --access public \
            --provenance \
            --no-git-checks
      - name: Record the staged release
        run: |
          {
            echo "Staged \`pi-dswa@$GITHUB_REF_NAME\` for approval."
            echo
            echo "The version is not public yet. Open the Staged Packages tab on npmjs.com, review the tarball, and approve it with 2FA. Or run \`pnpm stage list pi-dswa\`, then \`pnpm stage view <stage-id>\`, \`pnpm stage download <stage-id>\`, and \`pnpm stage approve <stage-id>\` locally."
          } >> "$GITHUB_STEP_SUMMARY"
